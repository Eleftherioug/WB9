<div class="container mt-5">
  <h1 class="text-center">What City Should You Live In?</h1>

  <!-- Question 1 -->
  <div class="question-block mb-3">
    <h4>1. What’s your ideal weekend?</h4>
    <button class="btn btn-outline-primary answer-btn" data-value="ny">Exploring museums</button>
    <button class="btn btn-outline-primary answer-btn" data-value="la">Going to the beach</button>
  </div>

  <!-- Question 2 -->
  <div class="question-block mb-3">
    <h4>2. Favorite weather?</h4>
    <button class="btn btn-outline-primary answer-btn" data-value="ny">Cold seasons</button>
    <button class="btn btn-outline-primary answer-btn" data-value="la">Warm all year</button>
  </div>

  <!-- Question 3 -->
  <div class="question-block mb-3">
    <h4>3. Pick a vibe:</h4>
    <button class="btn btn-outline-primary answer-btn" data-value="ny">Fast-paced city</button>
    <button class="btn btn-outline-primary answer-btn" data-value="la">Relaxed lifestyle</button>
  </div>

  <!-- Question 4 -->
  <div class="question-block mb-3">
    <h4>4. Favorite activity?</h4>
    <button class="btn btn-outline-primary answer-btn" data-value="ny">Broadway shows</button>
    <button class="btn btn-outline-primary answer-btn" data-value="la">Hiking</button>
  </div>

  <!-- Button -->
  <button id="result-btn" class="btn btn-success mt-3">Give Me Results</button>

  <!-- Result -->
  <div id="result-container" class="mt-4"></div>
</div>

<script src="script.js"></script>
